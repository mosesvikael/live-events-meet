name: LIVE EVENTS TZ web image

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    if: github.repository != 'jitsi/jitsi-meet'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: live-events-tz/Dockerfile.web
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/live-events-tz-web:latest
            ghcr.io/${{ github.repository_owner }}/live-events-tz-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
